<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">MotionScribe — passive compliant pen mount</title><desc id="desc">Conceptual section of a 3D-printed guide frame, elastic element, sliding carriage, and pen. Passive vertical compliance absorbs paper-height variation; active pen lift remains to be selected.</desc>
