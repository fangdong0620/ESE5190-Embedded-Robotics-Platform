<text x="64" y="753" font-size="18" font-weight="bold" fill="#087f8c">Purpose: absorb Z-height variation and reduce excessive contact force.</text>
<text x="64" y="775" font-size="16" font-weight="normal" fill="#5c7084">Passive compliance does not lift the pen. Active pen-up/down method remains VERIFY.</text>
